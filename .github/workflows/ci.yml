name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Types and content schemas
        run: npm run check

      - name: Language parity
        run: npm run check:i18n

      - name: Build
        run: npm run build

      - name: Smoke check dist/
        run: npm run check:dist
