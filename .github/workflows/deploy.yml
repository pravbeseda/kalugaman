name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Provisioned by Ansible; owned by the deploy user. public/ is what nginx serves,
  # public.new/ and public.old/ are the staging and rollback siblings.
  SITE_ROOT: /var/www/kalugaman.ru

jobs:
  deploy:
    # Kill switch: the job is skipped until DEPLOY_ENABLED is set in repository
    # variables — i.e. until the server and the SSH_* secrets exist.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same checks as ci.yml: deploy is its own gate, so a commit that reaches
      # main outside a green PR still cannot ship.
      - name: Format
        run: npm run format:check

      - name: Types and content schemas
        run: npm run check

      - name: Language parity
        run: npm run check:i18n

      - name: Build
        run: npm run build

      # The PDF resume is rendered from the print pages by a real browser, so the deploy is
      # where it happens: a PR build has no use for a 150MB Chromium. The cache is keyed on
      # the lockfile, which is what pins the Playwright version the browser must match.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: PDF resume
        run: npm run build:pdf

      - name: Smoke check dist/
        run: npm run check:dist -- --pdf

      - name: Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Upload build to staging directory
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          rsync -az --delete -e "ssh -p $SSH_PORT" \
            dist/ "$SSH_USER@$SSH_HOST:$SITE_ROOT/public.new/"

      - name: Swap into place
        id: swap
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" SITE_ROOT="$SITE_ROOT" bash -s <<'EOF'
          set -euo pipefail
          test -f "$SITE_ROOT/public.new/index.html"
          rm -rf "$SITE_ROOT/public.old"
          if [ -d "$SITE_ROOT/public" ]; then
            mv "$SITE_ROOT/public" "$SITE_ROOT/public.old"
          fi
          mv "$SITE_ROOT/public.new" "$SITE_ROOT/public"
          test -f "$SITE_ROOT/public/en/index.html"
          EOF

      - name: Verify site responds
        run: |
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w '%{http_code}\n' https://kalugaman.ru/en/

      # Only when the swap itself succeeded: on an earlier failure nothing was
      # swapped, and .old is the previous deploy — restoring it would replace a
      # live good build with an older one.
      - name: Roll back on failed verification
        if: failure() && steps.swap.outcome == 'success'
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" SITE_ROOT="$SITE_ROOT" bash -s <<'EOF'
          set -euo pipefail
          if [ ! -d "$SITE_ROOT/public.old" ]; then
            echo "No public.old to roll back to — leaving the site as is."
            exit 1
          fi
          rm -rf "$SITE_ROOT/public.bad"
          mv "$SITE_ROOT/public" "$SITE_ROOT/public.bad"
          mv "$SITE_ROOT/public.old" "$SITE_ROOT/public"
          echo "Rolled back to the previous build; the failed one is in $SITE_ROOT/public.bad"
          EOF
