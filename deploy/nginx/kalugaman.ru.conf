# nginx site config for kalugaman.ru — serves the static build from /var/www/kalugaman.ru.
# The directory is owned by the kalugaman-deploy user; the deploy workflow swaps public/
# by renaming, so nginx always sees a complete build.
#
# Provisioned by Ansible (see deploy/README.md). Certbot adds the TLS block and the
# 80 -> 443 redirect on top of this one.

# Root URL is served in the visitor's language; everything else is explicitly /en/ or /ru/.
# Only a leading "ru" wins: matching "ru" anywhere would send "en-US,en;q=0.9,ru;q=0.8"
# (English first, Russian as a fallback) to the Russian version — the opposite of what
# that visitor asked for. Everyone else gets English and the header's language switch.
map $http_accept_language $lang_redirect {
    default  /en/;
    ~*^ru    /ru/;
}

# Cache-Control is computed here rather than declared per location: nginx drops all
# inherited add_header directives as soon as a location declares one of its own, so a
# per-location Cache-Control would silently strip the security headers below.
# Astro's asset filenames are hashed, so /_astro/ is safe to cache forever; HTML is
# replaced by every deploy and must be revalidated.
map $uri $cache_control {
    default     "public, max-age=0, must-revalidate";
    ~^/_astro/  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name kalugaman.ru www.kalugaman.ru;

    root /var/www/kalugaman.ru/public;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # All add_header directives live at this level only — see the $cache_control map.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_control always;

    location = / {
        return 302 $lang_redirect;
    }

    location /_astro/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Takes effect once src/pages/404.astro exists (roadmap phase B); until then
    # nginx falls back to its built-in 404 page.
    error_page 404 /404.html;
}
