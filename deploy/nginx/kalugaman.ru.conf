# nginx site config for kalugaman.ru — static build served from the deploy user's home.
# Install: copy to /etc/nginx/sites-available/kalugaman.ru, symlink into sites-enabled,
# then run certbot --nginx -d kalugaman.ru -d www.kalugaman.ru (it adds the TLS block
# and the 80 -> 443 redirect itself).
#
# Replace DEPLOY_USER with the actual deploy user.

# Root URL is served in the visitor's language; everything else is explicitly /en/ or /ru/.
map $http_accept_language $lang_redirect {
    default    /en/;
    ~*^ru      /ru/;
    ~*[,;]\s*ru  /ru/;
}

server {
    listen 80;
    listen [::]:80;
    server_name kalugaman.ru www.kalugaman.ru;

    root /home/DEPLOY_USER/kalugaman.ru;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        return 302 $lang_redirect;
    }

    # Hashed filenames — safe to cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML must not be cached hard: a deploy replaces it and visitors should see it.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Takes effect once src/pages/404.astro exists (roadmap phase B); until then
    # nginx falls back to its built-in 404 page.
    error_page 404 /404.html;
}
